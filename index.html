<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Island Survival - サバイバルクラフト</title>
  <link rel="stylesheet" href="style.css?v=20261027_04">
</head>
<body>
  <div id="game-container">
    <!-- メインゲームキャンバス -->
    <canvas id="gameCanvas"></canvas>

    <!-- 視界ジャック・フルスクリーン効果レイヤー -->
    <div id="vision-jack-overlay"></div>

    <!-- UIオーバーレイ -->
    <div id="ui-layer">
      <!-- 1. ミニマル・トップバー（左：時間・天候、中央：目標、右：二人称視点・ヘルプ・マップ） -->
      <header id="top-bar">
        <div class="top-bar-left">
          <div id="time-display" class="hud-pill">
            <span id="sun-moon-icon">☀️</span>
            <span id="day-counter">Day 1</span>
            <span class="sep">•</span>
            <span id="clock-display">08:00</span>
          </div>
        </div>

        <div class="top-bar-center">
          <div id="quest-tracker" class="hud-pill">
            <span class="quest-icon">🎯</span>
            <span id="quest-text">木を伐採して木材を4個集めよう</span>
          </div>
        </div>

        <div class="top-bar-right">
          <!-- 二人称 3D 視点インジケーター（コンパクトピル型） -->
          <button id="switch-camera-btn" class="hud-pill clickable-pill" title="視界ジャック切替 [V]">
            <span class="sp-icon">👁️</span>
            <span id="camera-target-label">守護精霊 ナビ</span>
            <span class="key-tag">[V]</span>
          </button>

          <!-- 操作ヘルプ（トグル式） -->
          <div class="help-btn-wrapper">
            <button id="help-toggle-btn" class="hud-pill icon-btn" title="操作ヘルプ">❓</button>
            <div id="help-hint" class="hud-panel hidden-hint">
              <div class="hint-title">🕹️ 操作方法</div>
              <div class="hint-row"><span class="hint-key">WASD</span> 移動</div>
              <div class="hint-row"><span class="hint-key">Shift</span> ダッシュ</div>
              <div class="hint-row"><span class="hint-key">右ドラッグ</span> 視点旋回</div>
              <div class="hint-row"><span class="hint-key">左クリック</span> 攻撃 / 採取</div>
              <div class="hint-row"><span class="hint-key">右クリック</span> 使用 / 設置</div>
              <div class="hint-row"><span class="hint-key">E</span> インベントリ</div>
              <div class="hint-row"><span class="hint-key">V</span> 視界ジャック</div>
              <div class="hint-row"><span class="hint-key">Space</span> 水分補給</div>
            </div>
          </div>

          <!-- ミニマップ -->
          <div id="minimap-container">
            <canvas id="minimapCanvas" width="90" height="90"></canvas>
          </div>
        </div>
      </header>

      <!-- 2. 下部HUDゾーン（バイタルとホットバーをコンパクトに統合） -->
      <div id="bottom-hud-zone">
        <!-- プレイヤーバイタル（スリムゲージ） -->
        <div id="vitals-panel">
          <div class="vital-item" title="体力 (HP)">
            <span class="vital-icon">❤️</span>
            <div class="vital-bar-container">
              <div id="health-bar" class="vital-bar health" style="width: 100%;"></div>
            </div>
            <span id="health-text" class="vital-val">100</span>
          </div>

          <div class="vital-item" title="空腹度">
            <span class="vital-icon">🍖</span>
            <div class="vital-bar-container">
              <div id="hunger-bar" class="vital-bar hunger" style="width: 100%;"></div>
            </div>
            <span id="hunger-text" class="vital-val">100</span>
          </div>

          <div class="vital-item" title="水分">
            <span class="vital-icon">💧</span>
            <div class="vital-bar-container">
              <div id="thirst-bar" class="vital-bar thirst" style="width: 100%;"></div>
            </div>
            <span id="thirst-text" class="vital-val">100</span>
          </div>

          <div class="vital-item" title="スタミナ">
            <span class="vital-icon">⚡</span>
            <div class="vital-bar-container">
              <div id="stamina-bar" class="vital-bar stamina" style="width: 100%;"></div>
            </div>
            <span id="stamina-text" class="vital-val">100</span>
          </div>
        </div>

        <!-- 下部ホットバー -->
        <div id="bottom-bar">
          <div id="hotbar">
            <!-- 1〜8スロット -->
          </div>
        </div>
      </div>

      <!-- モバイル/スマホ用オンスクリーン コントロール -->
      <div id="mobile-controls" class="hidden">
        <!-- 左下：バーチャルジョイスティック -->
        <div id="joystick-zone">
          <div id="joystick-base">
            <div id="joystick-stick"></div>
          </div>
        </div>

        <!-- 右上：スマホ用インベントリ/クラフト ボタン -->
        <button id="btn-touch-inventory" class="touch-action-btn bag-btn" title="インベントリ">🎒</button>

        <!-- 右下：アクションボタン群 -->
        <div id="action-buttons-zone">
          <!-- 水分補給 / ドア・チェスト操作 -->
          <button id="btn-touch-action" class="touch-action-btn interact-btn" title="調べる / 飲む">💧</button>
          <!-- 視界ジャック切替 -->
          <button id="btn-touch-vision" class="touch-action-btn vision-btn" title="視界ジャック">👁️</button>
          <!-- アイテム使用 / 建築設置 -->
          <button id="btn-touch-use" class="touch-action-btn use-btn" title="使用 / 設置">🛠️</button>
          <!-- 攻撃 / 採掘・伐採 (メインボタン) -->
          <button id="btn-touch-attack" class="touch-action-btn attack-btn" title="攻撃 / 採取">⚔️</button>
        </div>
      </div>
    </div>

    <!-- インベントリ＆クラフト画面モーダル -->
    <div id="inventory-modal" class="modal hidden">
      <div class="modal-content">
        <div class="modal-header">
          <h2>🎒 インベントリ & クラフト [E]</h2>
          <button id="close-inventory-btn" class="close-btn">&times;</button>
        </div>
        <div class="modal-body">
          <div class="inv-section">
            <h3>所持品 (<span id="inv-count">0</span>/24)</h3>
            <div id="inventory-grid" class="item-grid"></div>
            <div id="selected-item-info" class="item-info-box">
              アイテムをクリックすると詳細が表示されます
            </div>
          </div>
          <div class="craft-section">
            <h3>🔨 クラフトレシピ <span id="workbench-indicator" class="badge">基本作業</span></h3>
            <div id="crafting-categories" class="tab-bar">
              <button class="tab-btn active" data-cat="all">すべて</button>
              <button class="tab-btn" data-cat="tools">道具・武器</button>
              <button class="tab-btn" data-cat="build">建築・家具</button>
              <button class="tab-btn" data-cat="survival">サバイバル</button>
            </div>
            <div id="crafting-list" class="craft-grid"></div>
            <div id="crafting-preview" class="craft-preview-box"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- チェスト用モーダル -->
    <div id="chest-modal" class="modal hidden">
      <div class="modal-content small-modal">
        <div class="modal-header">
          <h2>📦 木箱 (チェスト)</h2>
          <button id="close-chest-btn" class="close-btn">&times;</button>
        </div>
        <div class="modal-body">
          <div class="chest-container">
            <h4>チェストの中身</h4>
            <div id="chest-grid" class="item-grid"></div>
          </div>
          <div class="player-inv-container">
            <h4>あなたの所持品</h4>
            <div id="chest-player-grid" class="item-grid"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- ゲームオーバー画面 -->
    <div id="gameover-modal" class="modal hidden">
      <div class="modal-content gameover-box">
        <h1 class="gameover-title">💀 GAME OVER</h1>
        <p id="gameover-reason">力尽きてしまった...</p>
        <p id="survival-record">生存日数: 1日</p>
        <button id="respawn-btn" class="btn primary-btn">島でリスポーンする</button>
      </div>
    </div>

    <!-- 通知トースト -->
    <div id="toast-container"></div>
  </div>

  <!-- スクリプトの読み込み -->
  <script type="module" src="src/main.js?v=20261027_04"></script>
</body>
</html>
